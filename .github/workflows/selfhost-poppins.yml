name: selfhost-poppins
on:
  push:
    paths:
      - '.github/workflows/selfhost-poppins.yml'
      - 'assets/fonts/*.woff2.b64'
      - '_build/selfhost_poppins_apply.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode fonts and rewrite HTML
        run: |
          set -euo pipefail
          mkdir -p assets/fonts
          shopt -s nullglob
          for f in assets/fonts/*.woff2.b64; do
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            echo "decoded $out ($(wc -c < "$out") bytes)"
          done
          rm -f assets/fonts/*.woff2.b64
          python3 _build/selfhost_poppins_apply.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/fonts/ || true
          git add -u
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "CWV: self-host Poppins latin woff2; drop Google Fonts links"
            git push
          fi
