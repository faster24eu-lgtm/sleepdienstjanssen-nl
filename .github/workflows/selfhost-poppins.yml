name: selfhost-poppins
on:
  push:
    paths:
      - '.github/workflows/selfhost-poppins.yml'
      - 'assets/fonts/*.woff2.b64'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode fonts + swap HTML to local preloads
        run: |
          set -e
          mkdir -p assets/fonts
          for f in assets/fonts/*.woff2.b64; do
            [ -f "$f" ] || continue
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            echo "decoded $out ($(wc -c < "$out") bytes)"
          done
          rm -f assets/fonts/*.woff2.b64
          python3 <<'PY'
          from pathlib import Path
          import re
          NEW = '''  <link rel="preload" href="/assets/fonts/poppins-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/poppins-800-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/poppins-800i-latin.woff2" as="font" type="font/woff2" crossorigin>'''
          pat=re.compile(
            r'\s*<link rel="preconnect" href="https://fonts\.googleapis\.com">\s*'
            r'<link rel="preconnect" href="https://fonts\.gstatic\.com" crossorigin>\s*'
            r'<link href="https://fonts\.googleapis\.com/css2\?family=Poppins:[^"]+" rel="stylesheet">',
            re.S)
          n=0
          for f in Path('.').rglob('*.html'):
            t=f.read_text()
            if 'fonts.googleapis.com' not in t: continue
            nt,c=pat.subn(NEW, t, count=1)
            if c:
              f.write_text(nt); n+=1
          print('html updated', n)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/fonts/ '*.html' || true
          git add -u
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "CWV: self-host Poppins latin woff2; drop Google Fonts links"
            git push
          fi
